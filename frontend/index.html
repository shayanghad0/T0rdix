<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="T0rdix — all-in-one developer workspace: secrets, mock APIs, API testing, OpenAPI and fake data."
    />
    <title>T0rdix — Developer Workspace</title>
    <script>
      // Theme bootstrap before paint (dark first).
      try {
        const theme = localStorage.getItem("t0rdix-theme");
        if (theme === "light") document.documentElement.classList.remove("dark");
        else document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
